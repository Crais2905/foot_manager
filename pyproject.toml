[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "python-decouple>=3.8,<4",
    "PySide6>=6.8,<7",
    "qasync>=0.28,<1",
]

[project.scripts]
football-manager = "app.main:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "mypy>=1.10,<2", "pytest-qt>=4.4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.presentation" = ["*.qss"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: real PostgreSQL in an isolated temporary schema"]

[tool.mypy]
files = ["app"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["decouple"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qasync"]
ignore_missing_imports = true
